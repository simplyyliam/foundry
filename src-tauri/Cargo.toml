[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
default-run = "app"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = ["specta", "protocol-asset"] }
tauri-plugin-log = "2"
thiserror = "2"
tracing = { version = "0.1", features = ["log"] }
uuid = { version = "1", features = ["v4"] }
# Typed bindings. specta crates are pinned exactly while tauri-specta v2 is in RC.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
portable-pty = "0.9"
base64 = "0.22"
# Agent events (P8a): the local hook server. hyper, hyper-util and http-body-util were already
# in the tree via reqwest; hyper's `server` feature adds only `httpdate` (approved).
tokio = { version = "1", features = ["net", "time", "rt"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Agent events (P8b): desktop notifications (approved).
tauri-plugin-notification = "2"
# Requirement checks: text_absent patterns (approved). Linear-time matching, size-limited.
regex = "1"

[dev-dependencies]
tauri = { version = "2.11.0", features = ["specta", "protocol-asset", "test"] }
tempfile = "3"

[[bin]]
name = "fake-agent"
path = "src/bin/fake-agent.rs"
test = false

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"
test = false

# The Claude Code hook helper, shipped as a sidecar (see tauri.bundle.conf.json). Uses only
# std, serde and serde_json.
[[bin]]
name = "foundry-hook"
path = "src/bin/foundry-hook.rs"
test = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # get_window_radius: read-only reads of the Windhawk corner-radius mod's settings.
    "Win32_System_Registry",
    # delete_repository: IFileOperation moves the folder to the Recycle Bin.
    "Win32_System_Com",
    "Win32_UI_Shell",
    # Agent sessions: a Job Object per session, so stop and app exit kill the whole tree.
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
